name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run deterministic quality gates
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser journeys
        run: npm run test:e2e
      - name: Build and verify the GitHub Pages artifact
        run: npm run check:pages
      - name: Configure artifact-repository deploy key
        env:
          PAGES_DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PAGES_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Publish verified artifact
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          deploy_dir="$(mktemp -d)"
          git clone git@github.com:Falatua/adaptive-strength-hypertrophy-app-pages.git "$deploy_dir"
          git -C "$deploy_dir" rm -r --ignore-unmatch -- .
          cp -R dist/. "$deploy_dir"/
          printf '%s\n' "$SOURCE_SHA" > "$deploy_dir/source-version.txt"
          git -C "$deploy_dir" add -A
          git -C "$deploy_dir" config user.name "ForgePath Pages Bot"
          git -C "$deploy_dir" config user.email "actions@users.noreply.github.com"
          git -C "$deploy_dir" commit -m "Deploy source $SOURCE_SHA"
          git -C "$deploy_dir" push origin main
